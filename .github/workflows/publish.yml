name: Publish app and data

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site and encrypted data
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Since 2026-11-24 GitHub lists a freshly uploaded artifact only a few seconds later: deploy-pages,
      # started right after the upload, found "0 artifacts" and failed. Wait a little, and try once more if needed.
      - run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
