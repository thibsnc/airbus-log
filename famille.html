<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1d6e">
<title>Planning</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--deep:#1a1d6e;--brand:#1f55c9;--sky:#2db6e8;--gold:#f4b223;--red:#e5322d;--violet:#7b3fd4;--green:#2f9a55;--fg:#101a33;--muted:#5d6a88;--line:rgba(31,85,201,.14)}
*{box-sizing:border-box}
html{background:var(--deep);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--fg);
  background:radial-gradient(120% 60% at 100% 0%,rgba(45,182,232,.35),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(229,50,45,.28),transparent 60%),linear-gradient(170deg,#1f55c9 0%,#1a1d6e 70%);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
header{color:#fff;display:grid;gap:2px}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.01em}
header p{margin:0;font-size:12.5px;opacity:.8}
.card{background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(226,244,255,.84));border:1.5px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 12px 30px rgba(10,30,110,.3);padding:16px}
.now{display:grid;gap:6px}
.now .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.now .big{font-size:24px;font-weight:800;line-height:1.2;color:var(--deep)}
.now .big .ic{display:inline-block;margin-right:6px}
.now .sub{font-size:14.5px;color:var(--fg)}
.now .home{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff6dc;border:1px solid #f6d27a;border-radius:12px;padding:10px 12px}
.now .home span{font-size:12px;font-weight:700;color:#8a5a00;text-transform:uppercase;letter-spacing:.08em}
.now .home b{font-size:16px;color:var(--deep);text-align:right}
.track{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13.5px;font-weight:700;color:var(--brand);text-decoration:none}
h2{margin:6px 2px 0;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.list{padding:4px 0;overflow:hidden}
.row{display:grid;grid-template-columns:86px 34px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-size:12.5px;font-weight:700;color:var(--deep);line-height:1.25}
.row .d small{display:block;font-weight:600;color:var(--muted)}
.row .i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.row .t b{display:block;font-size:15px;color:var(--fg)}
.row .t span{display:block;font-size:12.5px;color:var(--muted)}
.row.today .d{color:var(--red)}
.row.past{opacity:.55}
.vol{--c:var(--violet)} .esc{--c:#0b78a8} .sol{--c:#c58a00} .off{--c:var(--red)}
.msg{color:#fff;text-align:center;opacity:.9;padding:40px 10px}
footer{color:#fff;opacity:.7;font-size:11.5px;text-align:center}
svg{display:block}
.upd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.upd:active{transform:scale(.96)}
header{padding-right:130px}
.msg small{display:block;font-size:12px;opacity:.7;margin-top:6px}
.retry{margin-top:14px;border:0;background:#fff;color:var(--deep);font:inherit;font-weight:800;padding:10px 18px;border-radius:999px}
.fday{display:grid}
.fday .dh{border-radius:18px 18px 0 0;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(219,240,252,.9));box-shadow:inset 0 -2px 0 var(--gold);color:var(--deep)}
.fday.today .dh{color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
.fday .dbody{border-radius:0 0 18px 18px;padding:0;overflow:hidden;border-top:0}
.fday .none{padding:12px 16px;font-weight:600}
.drow.mini{padding:6px 16px}
.drow.mini .i{width:34px;height:24px;background:transparent;font-size:14px}
.drow.mini .t b{font-size:13.5px;color:var(--muted);font-weight:700}
.drow.mini .h{font-size:14px;color:var(--muted)}
.leg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:6px;padding:12px 16px;border-top:1px solid var(--line);border-left:5px solid var(--violet)}
.leg .ap{display:grid;min-width:0}
.leg .ap b{font-size:28px;font-weight:900;letter-spacing:.02em;color:var(--fg);line-height:1.05}
.leg .ap small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .ap em{font-style:normal;font-weight:800;font-size:16px;color:var(--deep);font-variant-numeric:tabular-nums;margin-top:2px}
.leg .ap.r{text-align:right}
.leg .mid{display:grid;justify-items:center;gap:3px}
.leg .mid span{font-size:12.5px;font-weight:800;color:var(--deep)}
.leg .ln{display:flex;align-items:center;width:100%;gap:4px;color:var(--violet)}
.leg .ln u{flex:1;border-top:2px dashed rgba(123,63,212,.35)}
.leg .ln svg{width:18px;height:18px}
.leg .mid a{font-size:12px;font-weight:700;color:var(--brand);text-decoration:none}
.offrow{padding:12px 16px;text-align:center;font-size:20px;font-weight:800;letter-spacing:.35em;color:var(--red);border-top:1px solid var(--line);border-left:5px solid var(--red)}
.dbody>:first-child{border-top:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-weight:700;padding:8px 0;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.none{margin:0;color:var(--muted);font-size:14px;padding:4px 2px}
.mcal{padding:10px 6px 8px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px}
.mhead b{font-size:17px;color:var(--deep)}
.mnav{border:0;background:transparent;font-size:28px;line-height:1;color:var(--brand);width:40px;height:34px;cursor:pointer}
.mwh,.mrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.mwh span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.md{border:0;background:transparent;font:inherit;color:var(--deep);display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0 4px;cursor:pointer}
.md .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px}
.md.out{opacity:.3}
.md.today .n{color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.md.sel .n{background:var(--gold);color:var(--deep);box-shadow:0 5px 12px rgba(200,140,0,.45)}
.md.today.sel .n{background:var(--red);color:#fff}
.pi{height:15px;display:grid;place-items:center;color:var(--c)}
.pi svg,.mleg svg{width:15px;height:15px}
.pi.sol,.mleg .sol,.drow.sol .i{--c:#c58a00}
.mleg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:8px 4px 0;border-top:1px solid var(--line);margin-top:4px;font-size:12px;color:var(--muted)}
.mleg span{display:inline-flex;align-items:center;gap:4px}
.mleg svg{color:var(--c)}
.dayc{padding:0;overflow:hidden}
.dh{padding:9px 16px;font-weight:800;color:var(--deep);background:linear-gradient(90deg,#fff5d6,#fde3a0);box-shadow:inset 0 -2px 0 var(--gold)}
.dh.today{color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
.dayc .none{padding:12px 16px}
.drow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.dh+.drow{border-top:0}
.drow .i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.drow .t b{display:block;font-size:15px}
.drow .t a{font-size:12.5px;font-weight:700;color:var(--brand);text-decoration:none}
.drow .h{font-weight:800;font-variant-numeric:tabular-nums;color:var(--deep);white-space:nowrap}
</style>
</head>
<body>
<button class="upd" id="upd" type="button" onclick="location.replace(location.pathname+'?r='+Date.now()+location.hash)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Mettre à jour</button>
<main id="app"><p class="msg">Chargement du planning…</p></main>
<script>
(()=>{
const app=document.getElementById("app"); let D=null;
let t=(location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/)||[])[1];
try{ if(t) localStorage.setItem("fam:t",t); else t=localStorage.getItem("fam:t")||""; }catch(_){ }
const fail=(txt,detail)=>{ app.innerHTML=`<p class="msg">${txt}${detail?`<small>${esc(detail)}</small>`:""}<br><button class="retry" onclick="document.getElementById('upd').click()">Réessayer</button></p>`; };
window.addEventListener("error",e=>{ if(!D) fail("La page n'a pas pu s'afficher.",e.message||""); });
const API=/netlify\.app$/.test(location.hostname)?"":"https://aci-log.netlify.app";
const CITY={NOU:"Nouméa",GEA:"Nouméa Magenta",NAN:"Nadi",SUV:"Suva",WLS:"Wallis",FUT:"Futuna",AKL:"Auckland",SYD:"Sydney",BNE:"Brisbane",MEL:"Melbourne",PPT:"Papeete",VLI:"Port-Vila",NRT:"Tokyo",HND:"Tokyo",KIX:"Osaka",CDG:"Paris",BKK:"Bangkok",SIN:"Singapour",HKG:"Hong Kong",LAX:"Los Angeles",LIF:"Lifou",MEE:"Maré",UVE:"Ouvéa",ILP:"Île des Pins",KNQ:"Koné",TOU:"Touho",KOC:"Koumac"};
const city=c=>CITY[c]||c;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OFF=11*36e5, pad=n=>String(n).padStart(2,"0");
const nd=ts=>new Date(ts+OFF);
const hm=ts=>{ const d=nd(ts); return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes()); };
const WD=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."], MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dayK=ts=>{ const d=nd(ts); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); };
const dshort=ts=>{ const d=nd(ts); return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MO[d.getUTCMonth()]}`; };
const when=ts=>{ const k=dayK(ts), n=Date.now(); if(k===dayK(n)) return "aujourd'hui à "+hm(ts); if(k===dayK(n+864e5)) return "demain à "+hm(ts); return dshort(ts)+" à "+hm(ts); };
const route=s=>s.legs&&s.legs.length?[s.legs[0].from,...s.legs.map(l=>l.to)].map(city).join(" → "):s.title;
const flights=s=>[...new Set((s.legs||[]).map(l=>l.flight).filter(Boolean))];
const fr24=f=>`https://www.flightradar24.com/data/flights/${encodeURIComponent(f.toLowerCase())}`;
const IC={vol:"✈︎",esc:"🛏",sol:"📘",off:"🏠"};
if(!t){ fail("Lien incomplet : demande le lien à nouveau."); return; }
async function go(){
  let d; try{
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000);
    const r=await fetch(API+"/api/family?t="+t+"&_="+Date.now(),{cache:"no-store",signal:ctl.signal}); clearTimeout(to);
    if(r.status===404){ fail("Ce partage n'est plus actif, ou il n'a pas encore été envoyé depuis l'app."); return; }
    if(!r.ok) throw new Error("serveur "+r.status);
    d=await r.json(); }
  catch(e){ if(!D) fail("Impossible de charger le planning (connexion ?).",e&&e.name==="AbortError"?"délai dépassé":(e&&e.message)||""); return; }
  D=d; render();
}
function render(){
  const d=D; if(!d) return;
  const name=d.name||"", now=Date.now(), segs=(d.segs||[]).sort((a,b)=>a.start-b.start);
  document.title="Planning"+(name?" de "+name:"");
  const cur=segs.find(s=>s.start<=now&&s.end>now&&s.kind!=="off")||segs.find(s=>s.start<=now&&s.end>now);
  const nextTrip=segs.find(s=>s.kind==="vol"&&s.start>now);
  // the next time back home: end of the trip under way (the first flight duty ending in Nouméa)
  const away=cur&&(cur.kind==="vol"||cur.kind==="esc");
  const back=away?segs.find(s=>s.kind==="vol"&&s.end>now&&s.legs.length&&s.legs[s.legs.length-1].to==="NOU"):null;
  let k="En ce moment", big, sub="", track="";
  if(cur&&cur.kind==="vol"){
    const leg=cur.legs.find(l=>l.dep<=now&&l.arr>now), next=cur.legs.find(l=>l.dep>now), last=[...cur.legs].reverse().find(l=>l.arr<=now);
    if(leg){ big=`<span class="ic">✈︎</span>En vol vers ${esc(city(leg.to))}`; sub=`${esc(city(leg.from))} → ${esc(city(leg.to))} · arrivée prévue ${hm(leg.arr)}`; track=leg.flight; }
    else if(next&&last){ big=`<span class="ic">🛬</span>À ${esc(city(last.to))}`; sub=`Escale, prochain départ ${hm(next.dep)} vers ${esc(city(next.to))}`; track=next.flight; }
    else if(next){ big=`<span class="ic">🧳</span>Au travail`; sub=`Départ ${hm(next.dep)} vers ${esc(city(next.to))}`; track=next.flight; }
    else { big=`<span class="ic">🛬</span>Atterri à ${esc(city(cur.legs[cur.legs.length-1].to))}`; sub=`Fin de service vers ${hm(cur.end)}`; }
  } else if(cur&&cur.kind==="esc"){ big=`<span class="ic">🛏</span>À ${esc(city(cur.at))}`; sub=`En escale${nextTrip?`, départ ${esc(when(nextTrip.legs[0]?nextTrip.legs[0].dep:nextTrip.start))}`:""}`; }
  else if(cur&&cur.kind==="sol"){ big=`<span class="ic">📘</span>${esc(cur.title)}`; sub=`Jusqu'à ${hm(cur.end)}`; }
  else if(cur&&cur.kind==="off"){ big=`<span class="ic">🏠</span>En repos`; sub=nextTrip?`Prochain vol : ${esc(route(nextTrip))}, présentation ${esc(when(nextTrip.start))}`:""; }
  else { big=`<span class="ic">🏠</span>À la maison`; sub=nextTrip?`Prochain vol : ${esc(route(nextTrip))}, présentation ${esc(when(nextTrip.start))}`:"Aucun vol prévu pour l'instant"; }
  const upd=d.updatedAt?Math.round((now-Date.parse(d.updatedAt))/6e4):null;
  const updTxt=upd==null?"":upd<2?"à l'instant":upd<60?`il y a ${upd} min`:upd<1440?`il y a ${Math.round(upd/60)} h`:`il y a ${Math.round(upd/1440)} j`;
  let h=`<header><h1>Planning${name?" de "+esc(name):""}</h1><p>Heures de Nouméa · mis à jour ${updTxt}</p></header>`;
  h+=`<section class="card now"><div class="k">${k}</div><div class="big">${big}</div>${sub?`<div class="sub">${sub}</div>`:""}
    ${track?`<a class="track" href="${fr24(track)}" target="_blank" rel="noopener">Suivre le vol ${esc(track)} ›</a>`:""}
    ${back?`<div class="home"><span>Retour à la maison</span><b>${esc(when(back.end))}</b></div>`:""}</section>`;
  h+=`<div class="seg" role="group" aria-label="Affichage"><button data-v="list" aria-pressed="${view==="list"}">Liste</button><button data-v="cal" aria-pressed="${view==="cal"}">Calendrier</button></div>`;
  h+= view==="cal" ? calHTML(segs,now) : listHTML(segs,now);
  h+=`<footer>Planning partagé depuis ACI LOG · se met à jour tout seul</footer>`;
  app.innerHTML=h;
  app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; try{ localStorage.setItem("fam:view",view); }catch(_){ } render(); });
  app.querySelectorAll(".md").forEach(c=>c.onclick=()=>{ sel=c.dataset.day; const m=sel.slice(0,7); if(m!==month) month=m; render(); });
  app.querySelectorAll(".mnav").forEach(b=>b.onclick=()=>{ month=shiftM(month,+b.dataset.d); sel=null; render(); });
  const g=app.querySelector(".mcal"); if(g){ let sx=null,sy=null;
    g.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    g.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){ month=shiftM(month,dx<0?1:-1); sel=null; render(); } }); }
}
let view="list"; try{ view=localStorage.getItem("fam:view")==="cal"?"cal":"list"; }catch(_){ }
let month=dayK(Date.now()).slice(0,7), sel=null;
const MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const shiftM=(m,n)=>{ let y=+m.slice(0,4), mo=+m.slice(5,7)+n; while(mo<1){mo+=12;y--;} while(mo>12){mo-=12;y++;} return y+"-"+pad(mo); };
const kStart=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))-OFF;   // midnight in Nouméa
const addD=(k,n)=>dayK(kStart(k)+n*864e5+36e5);
const RANK={vol:4,esc:3,sol:2,off:1};
const SVG={
  vol:'<svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(90deg)"><path d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>',
  esc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2M9 7.5v12M15 7.5v12"/></svg>',
  sol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c3-1.3 6-1.3 9 .5 3-1.8 6-1.8 9-.5V19c-3-1.3-6-1.3-9 .5-3-1.8-6-1.8-9-.5z"/><path d="M12 6v13.5"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.7v9h5v-6h3.6v6h5v-9h2.7z"/></svg>'};
const onDay=(segs,k)=>{ const a=kStart(k), b=a+864e5; return segs.filter(s=>s.start<b&&s.end>a); };
// List view, like the app: one block per day (today first), each flight as a small card.
function listHTML(segs,now){
  const t=dayK(now), last=segs.length?dayK(Math.max(...segs.map(s=>s.end))-1):t;
  let h="";
  for(let k=t,i=0; k<=last&&i<60; k=addD(k,1),i++) h+=dayBlock(segs,k,t);
  return h||`<section class="card"><p class="none">Rien de prévu pour l'instant.</p></section>`;
}
function legCard(l){
  const m=Math.round((l.arr-l.dep)/6e4);
  return `<div class="leg"><div class="ap"><b>${esc(l.from)}</b><small>${esc(city(l.from))}</small><em>${hm(l.dep)}</em></div>
    <div class="mid"><span>${Math.floor(m/60)}h${pad(m%60)}</span><i class="ln"><u></u>${SVG.vol}<u></u></i>${l.flight?`<a href="${fr24(l.flight)}" target="_blank" rel="noopener">${esc(l.flight)} ›</a>`:""}</div>
    <div class="ap r"><b>${esc(l.to)}</b><small>${esc(city(l.to))}</small><em>${hm(l.arr)}</em></div></div>`;
}
// One day: presentation time, flights, back home, layover, training, rest.
function dayBody(segs,k){
  const a=kStart(k), b=a+864e5, out=[];
  const small=(kind,txt,time)=>`<div class="drow ${kind} mini"><div class="i">${IC[kind]}</div><div class="t"><b>${esc(txt)}</b></div><div class="h">${esc(time)}</div></div>`;
  for(const s of onDay(segs,k)){
    if(s.kind==="vol"){
      if(s.start>=a) out.push(small("vol","Présentation à l'aéroport",hm(s.start)));
      for(const l of s.legs) if(l.dep>=a&&l.dep<b) out.push(legCard(l));
      const last=s.legs[s.legs.length-1];
      if(s.end<b&&s.end>=a&&last&&last.to==="NOU") out.push(small("off","Retour à la maison",hm(s.end)));
    } else if(s.kind==="esc") out.push(`<div class="drow esc"><div class="i">${IC.esc}</div><div class="t"><b>Escale à ${esc(city(s.at))}</b></div><div class="h">${s.end<b?"jusqu'à "+hm(s.end):"toute la journée"}</div></div>`);
    else if(s.kind==="sol") out.push(`<div class="drow sol"><div class="i">${IC.sol}</div><div class="t"><b>${esc(s.title)}</b></div><div class="h">${hm(Math.max(s.start,a))} – ${hm(Math.min(s.end,b-6e4))}</div></div>`);
    else if(!out.some(x=>x.includes('class="offrow"'))) out.push(`<div class="offrow">Repos</div>`);
  }
  return out.join("")||`<p class="none">À la maison</p>`;
}
function dayBlock(segs,k,t){
  return `<section class="fday${k===t?" today":""}"><div class="dh">${esc(dlong(k))}${k===t?" · aujourd'hui":""}</div><div class="card dbody">${dayBody(segs,k)}</div></section>`;
}
const WDL=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const dlong=k=>{ const d=nd(kStart(k)+36e5); return `${WDL[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].toLowerCase()}`; };
function calHTML(segs,now){
  const t=dayK(now), y=+month.slice(0,4), m=+month.slice(5,7), first=month+"-01";
  const dow=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;
  let k=addD(first,-dow), h=`<section class="card mcal"><div class="mhead"><button class="mnav" data-d="-1" aria-label="Mois précédent">‹</button><b>${MONTHS[m-1]} ${y}</b><button class="mnav" data-d="1" aria-label="Mois suivant">›</button></div>
    <div class="mwh">${["lun","mar","mer","jeu","ven","sam","dim"].map(w=>`<span>${w}</span>`).join("")}</div>`;
  for(let w=0;w<6;w++){
    const days=[]; for(let i=0;i<7;i++,k=addD(k,1)) days.push(k);
    if(w===5&&+days[0].slice(5,7)!==m) break;
    h+=`<div class="mrow">`+days.map(d=>{
      const top=onDay(segs,d).sort((p,q)=>RANK[q.kind]-RANK[p.kind])[0];
      const cls=["md"]; if(+d.slice(5,7)!==m) cls.push("out"); if(d===t) cls.push("today"); if(d===(sel||t)) cls.push("sel");
      return `<button class="${cls.join(" ")}" data-day="${d}"><span class="n">${+d.slice(8)}</span><span class="pi ${top?top.kind:""}">${top?SVG[top.kind]:""}</span></button>`;
    }).join("")+`</div>`;
  }
  h+=`<div class="mleg"><span class="vol">${SVG.vol}Vol</span><span class="esc">${SVG.esc}Escale</span><span class="sol">${SVG.sol}Formation</span><span class="off">${SVG.off}Repos</span></div></section>`;
  h+=dayBlock(segs,sel||t,t);
  return h;
}
addEventListener("hashchange",()=>location.reload());
go(); setInterval(go,5*6e4);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) go(); });
})();
