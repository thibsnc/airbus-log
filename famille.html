<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1d6e">
<title>Planning</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--deep:#1a1d6e;--brand:#1f55c9;--sky:#2db6e8;--gold:#f4b223;--red:#e5322d;--violet:#7b3fd4;--green:#2f9a55;--fg:#101a33;--muted:#5d6a88;--line:rgba(31,85,201,.14)}
*{box-sizing:border-box}
html{background:var(--deep);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--fg);
  background:radial-gradient(120% 60% at 100% 0%,rgba(45,182,232,.35),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(229,50,45,.28),transparent 60%),linear-gradient(170deg,#1f55c9 0%,#1a1d6e 70%);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
header{color:#fff;display:grid;gap:2px}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.01em}
header p{margin:0;font-size:12.5px;opacity:.8}
.card{background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(226,244,255,.84));border:1.5px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 12px 30px rgba(10,30,110,.3);padding:16px}
.now{display:grid;gap:6px}
.now .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.now .big{font-size:24px;font-weight:800;line-height:1.2;color:var(--deep)}
.now .big .ic{display:inline-block;margin-right:6px}
.now .sub{font-size:14.5px;color:var(--fg)}
.now .home{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff6dc;border:1px solid #f6d27a;border-radius:12px;padding:10px 12px}
.now .home span{font-size:12px;font-weight:700;color:#8a5a00;text-transform:uppercase;letter-spacing:.08em}
.now .home b{font-size:16px;color:var(--deep);text-align:right}
.track{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13.5px;font-weight:700;color:var(--brand);text-decoration:none}
h2{margin:6px 2px 0;color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.list{padding:4px 0;overflow:hidden}
.row{display:grid;grid-template-columns:86px 34px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-size:12.5px;font-weight:700;color:var(--deep);line-height:1.25}
.row .d small{display:block;font-weight:600;color:var(--muted)}
.row .i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.row .t b{display:block;font-size:15px;color:var(--fg)}
.row .t span{display:block;font-size:12.5px;color:var(--muted)}
.row.today .d{color:var(--red)}
.row.past{opacity:.55}
.vol{--c:var(--violet)} .esc{--c:#0b78a8} .sol{--c:#c58a00} .off{--c:var(--red)}
.msg{color:#fff;text-align:center;opacity:.9;padding:40px 10px}
footer{color:#fff;opacity:.7;font-size:11.5px;text-align:center}
svg{display:block}
</style>
</head>
<body>
<main id="app"><p class="msg">Chargement du planning…</p></main>
<script>
(()=>{
const app=document.getElementById("app");
const t=(location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/)||[])[1];
const API=/netlify\.app$/.test(location.hostname)?"":"https://aci-log.netlify.app";
const CITY={NOU:"Nouméa",GEA:"Nouméa Magenta",NAN:"Nadi",SUV:"Suva",WLS:"Wallis",FUT:"Futuna",AKL:"Auckland",SYD:"Sydney",BNE:"Brisbane",MEL:"Melbourne",PPT:"Papeete",VLI:"Port-Vila",NRT:"Tokyo",HND:"Tokyo",KIX:"Osaka",CDG:"Paris",BKK:"Bangkok",SIN:"Singapour",HKG:"Hong Kong",LAX:"Los Angeles",LIF:"Lifou",MEE:"Maré",UVE:"Ouvéa",ILP:"Île des Pins",KNQ:"Koné",TOU:"Touho",KOC:"Koumac"};
const city=c=>CITY[c]||c;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OFF=11*36e5, pad=n=>String(n).padStart(2,"0");
const nd=ts=>new Date(ts+OFF);
const hm=ts=>{ const d=nd(ts); return pad(d.getUTCHours())+":"+pad(d.getUTCMinutes()); };
const WD=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."], MO=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const dayK=ts=>{ const d=nd(ts); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); };
const dshort=ts=>{ const d=nd(ts); return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MO[d.getUTCMonth()]}`; };
const when=ts=>{ const k=dayK(ts), n=Date.now(); if(k===dayK(n)) return "aujourd'hui à "+hm(ts); if(k===dayK(n+864e5)) return "demain à "+hm(ts); return dshort(ts)+" à "+hm(ts); };
const route=s=>s.legs&&s.legs.length?[s.legs[0].from,...s.legs.map(l=>l.to)].map(city).join(" → "):s.title;
const flights=s=>[...new Set((s.legs||[]).map(l=>l.flight).filter(Boolean))];
const fr24=f=>`https://www.flightradar24.com/data/flights/${encodeURIComponent(f.toLowerCase())}`;
const IC={vol:"✈︎",esc:"🛏",sol:"📘",off:"🏠"};
if(!t){ app.innerHTML=`<p class="msg">Lien incomplet : demande-le à nouveau.</p>`; return; }
async function go(){
  let d; try{ const r=await fetch(API+"/api/family?t="+t+"&_="+Date.now(),{cache:"no-store"}); if(r.status===404){ app.innerHTML=`<p class="msg">Ce partage n'est plus actif.</p>`; return; } d=await r.json(); }
  catch(_){ app.innerHTML=`<p class="msg">Pas de connexion. Réessaie dans un moment.</p>`; return; }
  const name=d.name||"", now=Date.now(), segs=(d.segs||[]).sort((a,b)=>a.start-b.start);
  document.title="Planning"+(name?" de "+name:"");
  const cur=segs.find(s=>s.start<=now&&s.end>now&&s.kind!=="off")||segs.find(s=>s.start<=now&&s.end>now);
  const nextTrip=segs.find(s=>s.kind==="vol"&&s.start>now);
  // the next time back home: end of the trip under way (the first flight duty ending in Nouméa)
  const away=cur&&(cur.kind==="vol"||cur.kind==="esc");
  const back=away?segs.find(s=>s.kind==="vol"&&s.end>now&&s.legs.length&&s.legs[s.legs.length-1].to==="NOU"):null;
  let k="En ce moment", big, sub="", track="";
  if(cur&&cur.kind==="vol"){
    const leg=cur.legs.find(l=>l.dep<=now&&l.arr>now), next=cur.legs.find(l=>l.dep>now), last=[...cur.legs].reverse().find(l=>l.arr<=now);
    if(leg){ big=`<span class="ic">✈︎</span>En vol vers ${esc(city(leg.to))}`; sub=`${esc(city(leg.from))} → ${esc(city(leg.to))} · arrivée prévue ${hm(leg.arr)}`; track=leg.flight; }
    else if(next&&last){ big=`<span class="ic">🛬</span>À ${esc(city(last.to))}`; sub=`Escale, prochain départ ${hm(next.dep)} vers ${esc(city(next.to))}`; track=next.flight; }
    else if(next){ big=`<span class="ic">🧳</span>Au travail`; sub=`Départ ${hm(next.dep)} vers ${esc(city(next.to))}`; track=next.flight; }
    else { big=`<span class="ic">🛬</span>Atterri à ${esc(city(cur.legs[cur.legs.length-1].to))}`; sub=`Fin de service vers ${hm(cur.end)}`; }
  } else if(cur&&cur.kind==="esc"){ big=`<span class="ic">🛏</span>À ${esc(city(cur.at))}`; sub=`En escale${nextTrip?`, départ ${esc(when(nextTrip.legs[0]?nextTrip.legs[0].dep:nextTrip.start))}`:""}`; }
  else if(cur&&cur.kind==="sol"){ big=`<span class="ic">📘</span>${esc(cur.title)}`; sub=`Jusqu'à ${hm(cur.end)}`; }
  else if(cur&&cur.kind==="off"){ big=`<span class="ic">🏠</span>En repos`; sub=nextTrip?`Prochain vol : ${esc(route(nextTrip))}, présentation ${esc(when(nextTrip.start))}`:""; }
  else { big=`<span class="ic">🏠</span>À la maison`; sub=nextTrip?`Prochain vol : ${esc(route(nextTrip))}, présentation ${esc(when(nextTrip.start))}`:"Aucun vol prévu pour l'instant"; }
  const upd=d.updatedAt?Math.round((now-Date.parse(d.updatedAt))/6e4):null;
  const updTxt=upd==null?"":upd<2?"à l'instant":upd<60?`il y a ${upd} min`:upd<1440?`il y a ${Math.round(upd/60)} h`:`il y a ${Math.round(upd/1440)} j`;
  let h=`<header><h1>Planning${name?" de "+esc(name):""}</h1><p>Heures de Nouméa · mis à jour ${updTxt}</p></header>`;
  h+=`<section class="card now"><div class="k">${k}</div><div class="big">${big}</div>${sub?`<div class="sub">${sub}</div>`:""}
    ${track?`<a class="track" href="${fr24(track)}" target="_blank" rel="noopener">Suivre le vol ${esc(track)} ›</a>`:""}
    ${back?`<div class="home"><span>Retour à la maison</span><b>${esc(when(back.end))}</b></div>`:""}</section>`;
  const list=segs.filter(s=>s.end>now-864e5&&s.start<now+45*864e5);
  if(list.length){
    h+=`<h2>Les prochaines semaines</h2><section class="card list">`+list.map(s=>{
      const multi=dayK(s.start)!==dayK(s.end-1);
      const dlab=multi?`${dshort(s.start)}<small>→ ${dshort(s.end-1)}</small>`:dshort(s.start);
      let b, sp;
      if(s.kind==="vol"){ b=route(s); const f=flights(s); sp=`Présentation ${hm(s.start)} · retour à la maison vers ${multi?dshort(s.end)+" ":""}${hm(s.end)}${f.length?` · ${f.join(", ")}`:""}`;
        if(s.legs.length&&s.legs[s.legs.length-1].to!=="NOU") sp=`Présentation ${hm(s.start)} · arrivée ${hm(s.legs[s.legs.length-1].arr)}${f.length?` · ${f.join(", ")}`:""}`; }
      else if(s.kind==="esc"){ b=`Escale à ${city(s.at)}`; sp=multi?`${Math.max(1,Math.round((s.end-s.start)/864e5))} nuit${Math.round((s.end-s.start)/864e5)>1?"s":""} sur place`:`Jusqu'à ${hm(s.end)}`; }
      else if(s.kind==="sol"){ b=s.title; sp=`${hm(s.start)} – ${hm(s.end)}`; }
      else { b="Repos"; sp=multi?`${Math.round((s.end-s.start)/864e5)} jours`:"Journée de repos"; }
      const cls=[s.kind]; if(s.start<=now&&s.end>now) cls.push("today"); else if(s.end<=now) cls.push("past");
      return `<div class="row ${cls.join(" ")}"><div class="d">${dlab}</div><div class="i">${IC[s.kind]}</div><div class="t"><b>${esc(b)}</b><span>${esc(sp)}</span></div></div>`;
    }).join("")+`</section>`;
  }
  h+=`<footer>Planning partagé depuis ACI LOG · se met à jour tout seul</footer>`;
  app.innerHTML=h;
}
go(); setInterval(go,5*6e4);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) go(); });
})();
</script>
</body>
</html>
